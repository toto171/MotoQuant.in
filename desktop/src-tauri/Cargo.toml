[package]
name = "motoquant-desktop"
version = "0.1.0"
description = "MotoQuant Pro desktop shell"
authors = ["Hritwik Mudhai <dhisetu@gmail.com>"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "motoquant_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
# Used for `shell:allow-open` — opening the billing/upgrade page in the user's
# default browser. (The hosted-only client no longer spawns any sidecar.)
tauri-plugin-shell = "2.0"
# Self-update (Ed25519-signed). Pubkey + endpoints live in tauri.conf.json.
tauri-plugin-updater = "2.0"
# OS keychain for the auth refresh token (macOS Keychain / Windows Credential
# Manager / Linux Secret Service). Platform backends are feature-gated; the
# Linux backend (sync-secret-service) is pure-Rust (zbus) so it builds without
# system D-Bus dev libs. NOTE: build/verify on a Rust toolchain (CI release
# matrix) — the Cowork sandbox has no cargo. If the Linux build complains, the
# fix is the feature set on this line.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
# NOTE: `tokio` (process/io-util) and `anyhow` were dropped in the hosted-only
# rewrite — they were used solely by the removed Python sidecar spawn path.

[features]
custom-protocol = ["tauri/custom-protocol"]
