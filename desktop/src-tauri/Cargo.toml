[package]
name = "motoquant-desktop"
version = "1.0.0-alpha.1"
description = "MotoQuant Pro desktop shell"
authors = ["Hritwik Mudhai <dhisetu@gmail.com>"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "motoquant_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["protocol-asset"] }
tauri-plugin-shell = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "rt-multi-thread", "time", "macros"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[features]
custom-protocol = ["tauri/custom-protocol"]
