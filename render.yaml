# Render Blueprint for the MotoQuant API (free, open source — Apache-2.0)
# https://render.com/docs/blueprint-spec
#
# Free-tier deployment plan (May 18, 2026):
#   - Single web service, Docker runtime, Free plan ($0/mo)
#   - Reuses the existing root-level Dockerfile (same one Railway uses today)
#   - Free tier sleeps after 15 min of no inbound traffic and cold-starts in
#     ~30-60s on next request. A GitHub Actions cron at
#     `.github/workflows/keepalive.yml` pings /api/health every 14 minutes to
#     keep the service warm during business hours.
#   - Migration is a soft cutover: Render comes up first, /api/health verified,
#     then `vercel.json` rewrite is flipped from the Railway URL to the Render
#     URL. Railway stays running 48h as a fallback before being suspended.
#
# To deploy:
#   1. Push this file to GitHub on `main`.
#   2. https://dashboard.render.com -> New -> Blueprint -> connect repo.
#   3. Render reads render.yaml, prompts approval, builds from Dockerfile.
#   4. Note the resulting `https://motoquant-api.onrender.com` URL.
#   5. See docs/RENDER_MIGRATION.md for the rest of the cutover.

services:
  - type: web
    name: motoquant-api
    runtime: docker
    plan: free
    region: singapore           # closest free region to Indian users
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true            # redeploy on pushes that touch the backend
    # Only rebuild when backend-relevant files change. Web-only pushes used
    # to restart the service too, wiping the in-memory jobs registry and
    # killing every in-flight simulation (2026-06-07: operator hit
    # "Progress lost" twice this way during a frontend deploy streak).
    buildFilter:
      paths:
        - motoquant/**
        - motoquant.db
        - requirements-api.txt
        - requirements-api.lock
        - Dockerfile
        - .dockerignore
        - docker-entrypoint.sh
        - render.yaml
        # The Rust physics core is compiled into the image (Dockerfile stage 1).
        - rust/Cargo.toml
        - rust/Cargo.lock
        - rust/motoquant-core/**
    envVars:
      - key: MOTOQUANT_DB
        # The catalog baked into the image. The server writes no visitor data
        # (saved runs live in each visitor's browser), so nothing needs a
        # persistent disk and a redeploy loses nothing.
        value: /app/motoquant.db
      - key: PYTHON_VERSION
        value: "3.11"
      # Physics engine: auto = the Rust core baked into the image when it
      # loads, else the Python reference (same numbers, ~50x slower). Set to
      # `python` here or in the dashboard as a no-rebuild kill switch;
      # /api/health -> engine shows what is live. docs/RUST_CORE.md.
      - key: MOTOQUANT_ENGINE
        value: auto
      # Render's edge is exactly one appending proxy: rate limits key on the
      # client IP it reports, never on a spoofable leftmost X-Forwarded-For.
      # (Auto mode also picks 1 on Render; this pins it explicitly.)
      - key: MOTOQUANT_TRUSTED_PROXY_HOPS
        value: "1"
      # Optional: surface FastAPI / uvicorn logs at INFO level
      - key: UVICORN_LOG_LEVEL
        value: info
      # Everything is free and anonymous: no billing, no accounts, and no
      # visitor data stored, so the catalog database baked into the image is
      # all the server needs (no persistent disk).
      # Optional settings (Render dashboard, never in git; the full list is in
      # docs/SELF_HOSTING.md):
      #   GROQ_API_KEY / GEMINI_API_KEY / ... + LLM_PROVIDER — the chat agent.
      #   MOTOQUANT_CHAT_DAILY_LIMIT — per-IP chat turns per day, the bill
      #     fuse on whoever pays for the LLM key (default 200; 0 disables).
      #   OPENWEATHERMAP_API_KEY — live weather for a named place.
      #   SEARCH_PROVIDER=brave|serper + SEARCH_API_KEY — upgrade the agent's
      #     web_search tool from the free DuckDuckGo fallback;
      #     MOTOQUANT_WEB_TOOLS=0 turns its web access off entirely.
      #   SENTRY_DSN — error tracking.
      #   POSTHOG_API_KEY — opt-in server-side usage telemetry; nothing is
      #     sent anywhere unless this is set.
      # All of them are optional: the API serves the simulator and catalog
      # without any.
