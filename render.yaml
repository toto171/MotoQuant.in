# Render Blueprint for MotoQuant API
# https://render.com/docs/blueprint-spec
#
# Free-tier deployment plan (May 18, 2026):
#   - Single web service, Docker runtime, Free plan ($0/mo)
#   - Reuses the existing root-level Dockerfile (same one Railway uses today)
#   - Free tier sleeps after 15 min of no inbound traffic and cold-starts in
#     ~30-60s on next request. A GitHub Actions cron at
#     `.github/workflows/keepalive.yml` pings /api/health every 14 minutes to
#     keep the service warm during business hours.
#   - Migration is a soft cutover: Render comes up first, /api/health verified,
#     then `vercel.json` rewrite is flipped from the Railway URL to the Render
#     URL. Railway stays running 48h as a fallback before being suspended.
#
# To deploy:
#   1. Push this file to GitHub on `main`.
#   2. https://dashboard.render.com -> New -> Blueprint -> connect repo.
#   3. Render reads render.yaml, prompts approval, builds from Dockerfile.
#   4. Note the resulting `https://motoquant-api.onrender.com` URL.
#   5. See docs/RENDER_MIGRATION.md for the rest of the cutover.

services:
  - type: web
    name: motoquant-api
    runtime: docker
    plan: free
    region: singapore           # closest free region to Indian users
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true            # redeploy on pushes that touch the backend
    # Only rebuild when backend-relevant files change. Web-only pushes used
    # to restart the service too, wiping the in-memory jobs registry and
    # killing every in-flight simulation (2026-06-07: operator hit
    # "Progress lost" twice this way during a frontend deploy streak).
    buildFilter:
      paths:
        - motoquant/**
        - motoquant.db
        - requirements-api.txt
        - requirements-api.lock
        - Dockerfile
        - docker-entrypoint.sh
        - render.yaml
    envVars:
      - key: MOTOQUANT_DB
        # FREE TIER (current): baked image copy — wiped on every deploy.
        # PAID TIER (account durability): repoint to the persistent disk below
        # and uncomment the `disk:` block. docker-entrypoint.sh seeds the disk
        # from the image copy on first boot, then preserves it across deploys.
        #   value: /data/motoquant.db   # <- uncomment WITH the disk block
        value: /app/motoquant.db
      - key: PYTHON_VERSION
        value: "3.11"
      # Optional: surface FastAPI / uvicorn logs at INFO level
      - key: UVICORN_LOG_LEVEL
        value: info
      # Optional accounts (saved runs) need a stable signing secret; set in
      # the Render dashboard (never in git):
      #   JWT_SECRET (32+ random bytes) — without it a random per-process
      #     secret is used and sign-in sessions reset on every restart
      #   SMTP_HOST/PORT/USER/PASS/FROM or RESEND_API_KEY (magic-link email)
      # NOTE: secrets (GEMINI_API_KEY, GROQ_API_KEY, SENTRY_DSN, JWT_SECRET,
      # etc.) are set manually in the
      # Render dashboard under Environment -> Add Environment Variable so they
      # never land in git. The keys listed in requirements-api.txt comments
      # are all optional — the API serves the simulator and catalog endpoints
      # without any of them.
      # Chat-agent web lookup (optional): SEARCH_PROVIDER=brave|serper +
      # SEARCH_API_KEY upgrade the agent's web_search tool from the free
      # DuckDuckGo HTML fallback to a proper search API. MOTOQUANT_WEB_TOOLS=0
      # turns the agent's web access off entirely.
    # ──────────────────────────────────────────────────────────────────────
    # ACCOUNT DURABILITY (paid plan only — Render disks are unavailable on the
    # free tier). When upgrading off free, uncomment this block AND repoint
    # MOTOQUANT_DB to /data/motoquant.db above. First boot copies the seeded
    # catalog onto the disk; thereafter users / saved runs
    # persist across deploys.
    # disk:
    #   name: motoquant-data
    #   mountPath: /data
    #   sizeGB: 1
