# Render Blueprint for the MotoQuant API (free, open source, Apache-2.0)
# https://render.com/docs/blueprint-spec
#
# Use this to host your own copy: Render dashboard -> New -> Blueprint ->
# connect your fork. Render builds the root Dockerfile on the free plan.
# Then check https://<service>.onrender.com/api/health and, if you want your
# own address, add a custom domain (Settings -> Custom Domains) and the CNAME
# record it asks for. docs/SELF_HOSTING.md covers the rest.
#
# The public instance (api.motoquant.in) was created with these settings but
# is not linked to this file, so editing it does not change production.
# Change the service in the Render dashboard too.
#
# The free plan sleeps after 15 minutes without traffic and takes about
# 30-60 s to wake. Two things keep it awake: the in-app self-ping
# (motoquant/keepwarm.py, on automatically on Render) and the Vercel cron
# that calls /api/wake (web/vercel.json). The GitHub Actions keep-alive
# (.github/workflows/keepalive.yml) is paused.

services:
  - type: web
    name: motoquant-api
    runtime: docker
    plan: free
    region: singapore           # closest free region to Indian users
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true            # redeploy on pushes that touch the backend
    # Only rebuild when backend-relevant files change. Web-only pushes used
    # to restart the service too, wiping the in-memory jobs registry and
    # killing every in-flight simulation (2026-06-07: operator hit
    # "Progress lost" twice this way during a frontend deploy streak).
    buildFilter:
      paths:
        - motoquant/**
        - motoquant.db
        - requirements-api.txt
        - requirements-api.lock
        - Dockerfile
        - .dockerignore
        - docker-entrypoint.sh
        - render.yaml
        # The Rust physics core is compiled into the image (Dockerfile stage 1).
        - rust/Cargo.toml
        - rust/Cargo.lock
        - rust/motoquant-core/**
    envVars:
      - key: MOTOQUANT_DB
        # The catalog baked into the image. The server writes no visitor data
        # (saved runs live in each visitor's browser), so nothing needs a
        # persistent disk and a redeploy loses nothing.
        value: /app/motoquant.db
      - key: PYTHON_VERSION
        value: "3.11"
      # Physics engine: auto = the Rust core baked into the image when it
      # loads, else the Python reference (same numbers, ~50x slower). Set to
      # `python` here or in the dashboard as a no-rebuild kill switch;
      # /api/health -> engine shows what is live. docs/RUST_CORE.md.
      - key: MOTOQUANT_ENGINE
        value: auto
      # Render's proxy is exactly one appending proxy, never a spoofable
      # leftmost X-Forwarded-For. The address it appends is Cloudflare's edge
      # (Render serves every service through Cloudflare), so on Render the
      # rate limits then key on the client in Cloudflare's CF-Connecting-IP
      # (motoquant/ratelimit.py). Auto mode also picks 1 on Render; this
      # pins it explicitly.
      - key: MOTOQUANT_TRUSTED_PROXY_HOPS
        value: "1"
      # Optional: surface FastAPI / uvicorn logs at INFO level
      - key: UVICORN_LOG_LEVEL
        value: info
      # Everything is free and anonymous: no billing, no accounts, and no
      # visitor data stored, so the catalog database baked into the image is
      # all the server needs (no persistent disk).
      # Optional settings (Render dashboard, never in git; the full list is in
      # docs/SELF_HOSTING.md):
      #   ANTHROPIC_API_KEY: the chat assistant's server key (Claude). Set it
      #     as a secret in the dashboard; without it visitors can still chat
      #     with their own key.
      #   MOTOQUANT_CHAT_DAILY_LIMIT: per-IP units per day for questions on
      #     the server key (mechanic 1, doctor 2; default 200; 0 disables).
      #     Questions asked with a visitor's own key skip it.
      #   OPENWEATHERMAP_API_KEY — live weather for a named place.
      #   SEARCH_PROVIDER=brave|serper + SEARCH_API_KEY — upgrade the agent's
      #     web_search tool from the free DuckDuckGo fallback;
      #     MOTOQUANT_WEB_TOOLS=0 turns its web access off entirely.
      #   SENTRY_DSN — error tracking.
      #   POSTHOG_API_KEY — opt-in server-side usage telemetry; nothing is
      #     sent anywhere unless this is set.
      # All of them are optional: the API serves the simulator and catalog
      # without any.
