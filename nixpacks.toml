# Railway / Nixpacks build configuration for MotoQuant Pro API
# https://nixpacks.com/docs/configuration/file

providers = ["python"]

[phases.setup]
nixPkgs = ["python311", "gcc"]

[phases.install]
cmds = ["python -m pip install --upgrade pip", "pip install -r requirements-api.txt"]

[phases.build]
# No build step — FastAPI serves directly from source
cmds = ["echo 'Build complete — ready to serve'"]

[start]
cmd = "uvicorn motoquant.api:app --host 0.0.0.0 --port $PORT"

[variables]
PYTHON_VERSION = "3.11"
# Path to the seeded SQLite database inside the Railway container.
# Set this env var in Railway dashboard to match where motoquant.db is mounted.
MOTOQUANT_DB = "/app/motoquant.db"
