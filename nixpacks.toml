# Railway Nixpacks build config for MotoQuant Pro API

[phases.setup]
nixPkgs = ["python311", "gcc"]

[phases.install]
cmds = [
    "python3 -m pip install --upgrade pip",
    "python3 -m pip install -r requirements-api.txt",
]

[start]
cmd = "python3 -m uvicorn motoquant.api:app --host 0.0.0.0 --port ${PORT:-8000}"
