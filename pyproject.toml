[project]
name = "motoquant"
version = "4.0.0"
description = "The physics of faster — First-principles motorcycle quarter-mile simulation & optimization"
authors = [{name = "Hritwik Mudhai", email = "dhisetu@gmail.com"}]
requires-python = ">=3.10"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Flat layout: repo root holds several top-level dirs (motoquant, tests,
# scripts, web, desktop, ...). Without an explicit find directive, setuptools
# auto-discovery aborts with "Multiple top-level packages discovered", which
# breaks `pip install -e .` in the desktop sidecar CI build. Restrict the
# installed distribution to the motoquant package and its subpackages.
include = ["motoquant*"]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    ".git",
    ".pytest_cache",
    ".venv",
    "__pycache__",
    "*.egg-info",
    ".ruff_cache",
    "node_modules",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (modern Python idioms)
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie (misc improvements)
]
ignore = [
    "E501",  # line too long (ruff format handles this)
    "W291",  # trailing whitespace (ruff format handles this)
]

[tool.ruff.lint.isort]
known-first-party = ["motoquant"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
# Allow unused imports in __init__.py files (used for public API exports)
"**/__init__.py" = ["F401"]
# One-off operational scripts (diagnostics, dated patches, audits, sweeps): debug printf,
# sys.path-then-import, and condensed audit code are intentional here.
"scripts/*" = ["UP031", "E402", "E701"]
# Test modules set up sys.path / env before importing the package under test.
"tests/*" = ["E402"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q"
