[project]
name = "motoquant"
version = "4.0.0"
description = "The physics of faster — First-principles motorcycle quarter-mile simulation & optimization"
authors = [{name = "Hritwik Mudhai", email = "dhisetu@gmail.com"}]
requires-python = ">=3.10"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    ".git",
    ".pytest_cache",
    ".venv",
    "__pycache__",
    "*.egg-info",
    ".ruff_cache",
    "node_modules",
    # Legacy Streamlit single-file UI being phased out by the Tauri/React
    # desktop app under desktop/. Uses condensed multi-statement-per-line
    # patterns and dict() literals that are intentional for the tabular
    # tire/parts param-binding code; rewriting to ruff-clean form would
    # hurt readability without functional benefit. Skipped from lint
    # until the desktop app fully replaces it (Phase 5 post-launch).
    "app.py",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (modern Python idioms)
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie (misc improvements)
]
ignore = [
    "E501",  # line too long (ruff format handles this)
    "W291",  # trailing whitespace (ruff format handles this)
]

[tool.ruff.lint.isort]
known-first-party = ["motoquant"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
# Allow unused imports in __init__.py files (used for public API exports)
"**/__init__.py" = ["F401"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q"
