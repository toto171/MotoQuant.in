name: Release

# Trigger: push any tag starting with "v" (e.g. v0.1.0, v1.2.3-rc1).
# The tag IS the release — CI builds all four platform bundles, uploads them
# to the matching GitHub Release draft, then generates the Tauri updater
# manifest (latest.json) as a final step.
#
# Required secrets (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY          Ed25519 private key (base64). Generate:
#                                        cargo tauri signer generate -w ~/.tauri/motoquant.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  Passphrase you chose during keygen (may be empty).
#
# The matching PUBLIC key must be pasted into desktop/src-tauri/tauri.conf.json
# under plugins.updater.pubkey before the first signed release.
#
# Windows code-signing (optional, suppresses SmartScreen):
#   WINDOWS_CERTIFICATE        Base64-encoded PFX file
#   WINDOWS_CERTIFICATE_PASSWORD  PFX password
#
# macOS code-signing + notarisation (optional, suppresses Gatekeeper):
#   APPLE_CERTIFICATE          Base64-encoded .p12 Developer ID Application cert
#   APPLE_CERTIFICATE_PASSWORD .p12 export password
#   APPLE_ID                   Your Apple ID email
#   APPLE_ID_PASSWORD          App-specific password
#   APPLE_TEAM_ID              10-character team ID

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # Never cancel a release in flight.

# ── Per-platform build ───────────────────────────────────────────────────────
jobs:
  build:
    name: Build — ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write   # Needed to upload release assets.
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux x64 ────────────────────────────────────────────────────
          - name: Linux x64
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            sidecar_name: motoquant-backend-x86_64-unknown-linux-gnu
            sidecar_ext: ""
            bundle_targets: deb,appimage
            tauri_platform_args: ""

          # ── macOS arm64 (Apple Silicon) ───────────────────────────────
          - name: macOS arm64
            os: macos-14
            rust_target: aarch64-apple-darwin
            sidecar_name: motoquant-backend-aarch64-apple-darwin
            sidecar_ext: ""
            bundle_targets: dmg,app
            tauri_platform_args: ""

          # ── macOS x64 (Intel) ─────────────────────────────────────────
          - name: macOS x64
            os: macos-13
            rust_target: x86_64-apple-darwin
            sidecar_name: motoquant-backend-x86_64-apple-darwin
            sidecar_ext: ""
            bundle_targets: dmg,app
            tauri_platform_args: ""

          # ── Windows x64 ───────────────────────────────────────────────
          - name: Windows x64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            sidecar_name: motoquant-backend-x86_64-pc-windows-msvc
            sidecar_ext: ".exe"
            bundle_targets: msi,nsis
            tauri_platform_args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Python / sidecar ────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-api.txt
            desktop/sidecar/requirements-sidecar.txt

      - name: Install motoquant + sidecar deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt
          pip install -e .
          pip install -r desktop/sidecar/requirements-sidecar.txt

      - name: Verify bundled database
        shell: bash
        run: |
          # The tracked motoquant.db (checked out above) IS the canonical seeded
          # catalog Render/web serves. Re-seeding here is redundant AND fails:
          # `db seed` raises a FOREIGN KEY IntegrityError when run against the
          # already-populated DB (a known idempotency artifact). So we just
          # verify the checked-out catalog instead of regenerating it.
          test -f motoquant.db || { echo "::error::motoquant.db missing from checkout"; exit 1; }
          python -c "import sqlite3; n=sqlite3.connect('motoquant.db').execute('select count(*) from bike_models').fetchone()[0]; print(f'Bundling tracked catalog: {n} bikes'); assert n >= 450, f'tracked catalog too small: {n}'  # floor updated post-dedup (799->498, 2026-06-01)"
          echo "DB size: $(du -h motoquant.db | cut -f1)"

      - name: Build PyInstaller sidecar
        shell: bash
        working-directory: desktop/sidecar
        run: |
          rm -rf build dist __pycache__
          pyinstaller motoquant-backend.spec --clean --noconfirm
          ls -lh dist/

      - name: Smoke-test sidecar binary
        shell: bash
        working-directory: desktop/sidecar
        run: |
          BIN="dist/motoquant-backend${{ matrix.sidecar_ext }}"
          PORT=$(python - <<'PY'
          import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()
          PY
          )
          "$BIN" --host 127.0.0.1 --port "$PORT" --log-level warning &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            sleep 0.5
            if curl -fsS "http://127.0.0.1:$PORT/api/health" > /tmp/health.json 2>/dev/null; then
              echo "Sidecar health: $(cat /tmp/health.json)"
              break
            fi
          done
          kill $PID 2>/dev/null || true

      - name: Stage sidecar into Tauri bin/
        shell: bash
        run: |
          mkdir -p desktop/src-tauri/bin
          cp "desktop/sidecar/dist/motoquant-backend${{ matrix.sidecar_ext }}" \
             "desktop/src-tauri/bin/${{ matrix.sidecar_name }}${{ matrix.sidecar_ext }}"
          echo "Staged: $(ls -lh desktop/src-tauri/bin/)"

      # ── Node / Rust ──────────────────────────────────────────────────────
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install npm dependencies
        working-directory: desktop
        run: npm ci

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workdir: desktop/src-tauri

      # ── Optional: Windows code-signing ──────────────────────────────────
      - name: Import Windows certificate
        if: runner.os == 'Windows' && vars.ENABLE_WINDOWS_SIGNING == 'true'
        shell: powershell
        run: |
          $cert = [System.Convert]::FromBase64String("${{ secrets.WINDOWS_CERTIFICATE }}")
          $certFile = "$env:TEMP\motoquant_cert.pfx"
          [System.IO.File]::WriteAllBytes($certFile, $cert)
          Import-PfxCertificate -FilePath $certFile `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password (ConvertTo-SecureString "${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}" -AsPlainText -Force)
          Remove-Item $certFile

      # ── Optional: macOS code-signing ────────────────────────────────────
      - name: Import macOS certificate
        if: runner.os == 'macOS' && vars.ENABLE_MACOS_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/motoquant.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          rm /tmp/cert.p12

      # ── Tauri build ──────────────────────────────────────────────────────
      - name: Build Tauri bundle
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npx tauri build --target ${{ matrix.rust_target }} --bundles ${{ matrix.bundle_targets }}

      # ── Upload artifacts ─────────────────────────────────────────────────
      - name: Find bundle artifacts
        id: artifacts
        shell: bash
        run: |
          # Collect all installer + .sig files from the bundle output dir
          BUNDLE_DIR="desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle"
          FILES=$(find "$BUNDLE_DIR" -type f \( \
            -name "*.deb" -o -name "*.AppImage" -o \
            -name "*.dmg" -o -name "*.app.tar.gz" -o \
            -name "*.msi" -o -name "*.exe" -o \
            -name "*.sig" \
          \) | tr '\n' ',')
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "bundle_dir=$BUNDLE_DIR" >> "$GITHUB_OUTPUT"
          find "$BUNDLE_DIR" -type f | sort

      - name: Upload bundles to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*.deb
            desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*.AppImage
            desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*.AppImage.sig
            desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*.dmg
            desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*.dmg.sig
            desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*.app.tar.gz
            desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*.app.tar.gz.sig
            desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*.msi
            desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*.msi.sig
            desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/nsis/*.exe
            desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/nsis/*.exe.sig

  # ── Generate Tauri updater manifest ─────────────────────────────────────
  update-manifest:
    name: Generate latest.json updater manifest
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get release assets
        id: assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Fetch the draft release asset list
          gh release view "$TAG" --json assets --jq '.assets[].name' > asset_names.txt || true
          cat asset_names.txt

      - name: Generate latest.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          BASE_URL="https://github.com/da25mem5s02-debug/MotoQuant_v1/releases/download/${TAG}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Helper: read .sig file content from the release
          get_sig() {
            local asset="$1"
            gh release download "$TAG" --pattern "$asset" -D /tmp/sigs 2>/dev/null
            cat "/tmp/sigs/$asset" 2>/dev/null || echo "SIG_UNAVAILABLE"
          }

          # Collect signatures for each platform's primary installer
          # Linux: AppImage is the recommended auto-updatable target
          LINUX_SIG=$(get_sig "*.AppImage.sig" 2>/dev/null || echo "")
          LINUX_URL=$(gh release view "$TAG" --json assets \
            --jq '.assets[] | select(.name | endswith(".AppImage")) | .browserDownloadUrl' \
            | head -1)

          # macOS arm64 (dmg)
          MACOS_ARM_SIG=$(ls /tmp/sigs/*.dmg.sig 2>/dev/null | head -1 | xargs cat 2>/dev/null || echo "")
          # There will be multiple .dmg files — filter by arch in filename
          MACOS_ARM_URL=$(gh release view "$TAG" --json assets \
            --jq '.assets[] | select(.name | test("aarch64.*\\.dmg$|arm64.*\\.dmg$")) | .browserDownloadUrl' \
            | head -1)

          # macOS x64 (dmg)
          MACOS_X64_URL=$(gh release view "$TAG" --json assets \
            --jq '.assets[] | select(.name | test("x86_64.*\\.dmg$|intel.*\\.dmg$|\\.dmg$")) | .browserDownloadUrl' \
            | head -1)

          # Windows (msi)
          WIN_SIG=$(get_sig "*.msi.sig" 2>/dev/null || echo "")
          WIN_URL=$(gh release view "$TAG" --json assets \
            --jq '.assets[] | select(.name | endswith(".msi")) | .browserDownloadUrl' \
            | head -1)

          cat > latest.json << MANIFEST
          {
            "version": "${VERSION}",
            "notes": "See full release notes at ${BASE_URL}",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "linux-x86_64": {
                "signature": "${LINUX_SIG}",
                "url": "${LINUX_URL}"
              },
              "darwin-aarch64": {
                "signature": "${MACOS_ARM_SIG}",
                "url": "${MACOS_ARM_URL}"
              },
              "darwin-x86_64": {
                "signature": "",
                "url": "${MACOS_X64_URL}"
              },
              "windows-x86_64": {
                "signature": "${WIN_SIG}",
                "url": "${WIN_URL}"
              }
            }
          }
          MANIFEST

          echo "Generated latest.json:"
          cat latest.json

      - name: Upload latest.json to release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: latest.json

      - name: Publish release (remove draft)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" --draft=false
          echo "Release published: ${GITHUB_REF_NAME}"
