name: E2E smoke (manual)

# Least-privilege: read-only Playwright smoke; no write scope needed.
permissions:
  contents: read

# MANUAL-TRIGGER ONLY — never auto-on-PR. This harness is intentionally
# low-risk while it stabilizes: a flaky Playwright run must never be able to
# red a pull request. Run it on demand from the Actions tab
# (Actions → "E2E smoke (manual)" → Run workflow).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test (defaults to the selected branch)"
        required: false
        default: ""

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Landing → quick-sim smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      # ── Backend (FastAPI) ────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-api.txt
            pyproject.toml

      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt
          pip install -e .

      - name: Seed a scratch database (/tmp/e2e.db)
        # Fresh, empty DB → init → import → seed. This is the same sequence
        # the CI "python" job runs against /tmp/ci.db, so it's known-good and
        # side-steps the "re-seeding the tracked DB raises a FK error"
        # idempotency artifact (first documented in the since-deleted desktop
        # sidecar-smoke job).
        run: |
          python -m motoquant.run --db /tmp/e2e.db db init
          python -m motoquant.run --db /tmp/e2e.db import --known-bikes
          python -m motoquant.run --db /tmp/e2e.db db seed

      # ── Frontend (Next.js) ───────────────────────────────────────────────
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        # web/package.json is untouched by the e2e harness, so npm ci stays in
        # sync with the committed lockfile (same as the CI web job).
        run: npm ci

      - name: Install e2e (Playwright) dependencies
        working-directory: e2e
        # The harness is self-contained under e2e/ (its own package.json), so
        # the web lockfile is never perturbed by the test runner.
        run: npm install

      - name: Install Playwright Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Build web app (pointed at the local API)
        working-directory: web
        # NEXT_PUBLIC_* is baked at build time, so the browser bundle fetches
        # the local uvicorn instead of the production Render rewrite.
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
        run: npm run build

      # ── Boot the stack + run the smoke ───────────────────────────────────
      - name: Boot API + web and run Playwright
        working-directory: web
        env:
          MOTOQUANT_DB: /tmp/e2e.db
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
          E2E_BASE_URL: http://localhost:3000
        run: |
          set -euo pipefail

          # 1. API on :8000 (from repo root).
          ( cd "$GITHUB_WORKSPACE" && \
            python -m uvicorn motoquant.api:app \
              --host 127.0.0.1 --port 8000 --log-level warning \
              > /tmp/uvicorn.log 2>&1 ) &
          API_PID=$!

          # 2. Next production server on :3000 (already built above).
          ( npm start -- --hostname 127.0.0.1 --port 3000 \
              > /tmp/next.log 2>&1 ) &
          WEB_PID=$!

          cleanup() { kill "$API_PID" "$WEB_PID" 2>/dev/null || true; }
          trap cleanup EXIT

          echo "Waiting for API /api/health ..."
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null 2>&1; then
              echo "✓ API up"; break
            fi
            sleep 1
            [ "$i" -eq 60 ] && { echo "❌ API never came up"; cat /tmp/uvicorn.log; exit 1; }
          done

          echo "Waiting for web http://localhost:3000 ..."
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/ >/dev/null 2>&1; then
              echo "✓ web up"; break
            fi
            sleep 1
            [ "$i" -eq 60 ] && { echo "❌ web never came up"; cat /tmp/next.log; exit 1; }
          done

          echo "Running Playwright smoke ..."
          ( cd "$GITHUB_WORKSPACE/e2e" && npx playwright test )

      - name: Upload Playwright HTML report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          # Playwright resolves a relative reporter folder against the config
          # directory (e2e/), but upload both candidate locations to be safe.
          path: |
            e2e/playwright-report
            e2e/test-results
            web/playwright-report
          if-no-files-found: ignore
          retention-days: 14
