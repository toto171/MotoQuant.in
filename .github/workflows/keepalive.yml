name: Render keep-alive

# Least-privilege: only makes an outbound HTTP ping; needs no repo access.
permissions:
  contents: read

# Render's free tier puts services to sleep after 15 minutes of no inbound
# traffic. Cold-start on the next request takes ~30-60 seconds, which would
# tank the live simulator widget on motoquant.in for any visitor who hits
# the page after a quiet period.
#
# This workflow pings /api/health every 14 minutes (one minute under the
# sleep threshold) which counts as inbound traffic and keeps the dyno warm.
# Cost: ~3000 runs/mo * ~6s each ≈ 5 GitHub Actions hours/mo, well under
# the 2000-minute free tier quota for public repos (and 2000 min for private
# accounts too).
#
# If the service is down, the curl will fail and the job will report a
# failure in the Actions tab — useful as a free uptime monitor too.
#
# To disable temporarily without deleting the file: comment out the
# `schedule:` block. Manual runs via `workflow_dispatch` always remain
# available from the Actions tab.
#
# OPT-IN (open-source repo): the job is a NO-OP unless the repository
# variable RENDER_API_URL is set (Settings -> Secrets and variables ->
# Actions -> Variables), e.g. https://motoquant-api.onrender.com. A fork, or
# any copy of this repo, therefore never pings someone else's deployment.

on:
  # SCHEDULE PAUSED (July 14, 2026, operator decision): the account crossed
  # its 3,000 Actions-minutes/month cap, and this cron was the dominant
  # consumer — each throttled run can burn up to ~11 billed minutes in the
  # 4x150s cold-start retry loop (~77 scheduled runs/day). The other two
  # keep-alive layers cost zero Actions minutes and stay active:
  #   1. Vercel cron -> /api/wake (vercel.json, 3x daily)
  #   2. in-app self-ping (motoquant/keepwarm.py) holding the day once woken
  # Re-enable by uncommenting the schedule block below if ever needed —
  # moot after the planned move off Render's free tier to Oracle.
  #
  # schedule:
  #   # Every 14 minutes during IST waking hours only — UTC 00:00-18:59
  #   # maps to roughly 05:30 AM - 11:59 PM IST. 14-min interval = 1-min
  #   # safety margin under Render's 15-min sleep threshold; the 0-18 UTC
  #   # window keeps Render instance-hours (~595/mo) under the 750 cap.
  #   - cron: "*/14 0-18 * * *"
  workflow_dispatch:        # manual triggering stays available

# Cancel any backed-up runs if a new one starts — no point pinging twice
# in quick succession if GH was lagging.
concurrency:
  group: render-keepalive
  cancel-in-progress: true

jobs:
  ping:
    # Opt-in: skipped (green, zero minutes) unless this repo configures its
    # own service URL. There is deliberately no hard-coded default.
    if: ${{ vars.RENDER_API_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12    # 4 retries x 150s curl + gaps; cold start can take minutes
    steps:
      - name: Ping /api/health
        env:
          # Repo Settings -> Secrets and variables -> Actions -> Variables ->
          # RENDER_API_URL (the deployment this repo owns).
          RENDER_API_URL: ${{ vars.RENDER_API_URL }}
        # Retry loop (2026-06-06): GitHub throttles */14 crons to every 1-8 h
        # in practice, so most pings land on a COLD service, and free-tier
        # cold starts routinely exceed the old single 90 s curl window. That
        # made every run fail with curl exit 28 while the service went right
        # back to sleep. Four attempts x 150 s + 20 s gaps = a ~11-minute
        # wake window, so a throttled ping still goes green and leaves the
        # service warm (the in-app loop in motoquant/keepwarm.py then holds
        # it awake for the rest of the active window).
        run: |
          url="$RENDER_API_URL/api/health"
          max_attempts=4
          attempt=1
          while [ "$attempt" -le "$max_attempts" ]; do
            echo "Attempt $attempt/$max_attempts: pinging $url ..."
            status=$(curl --silent --show-error --output /tmp/health_body \
                          --max-time 150 --write-out "%{http_code}" \
                          "$url") || status="000"
            echo "HTTP status: $status"
            if [ "$status" = "200" ]; then
              cat /tmp/health_body; echo
              echo "Health check OK (attempt $attempt)"
              exit 0
            fi
            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "Service not up yet (HTTP $status) — retrying in 20s (cold start can take minutes)"
              sleep 20
            fi
            attempt=$((attempt+1))
          done
          echo "::error::No HTTP 200 after $max_attempts attempts (~10 min) — service is genuinely down; check the Render dashboard"
          exit 1
