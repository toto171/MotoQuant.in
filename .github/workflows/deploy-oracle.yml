name: Deploy to Oracle VM

# Optional auto-deploy-on-push, mirroring the convenience Render's git
# integration gave us. Disabled (no-ops with a warning) until you add three
# repo secrets — see docs/ORACLE_MIGRATION.md Step 6:
#   Settings -> Secrets and variables -> Actions -> New repository secret
#     ORACLE_SSH_HOST  — the VM's public IP or api.motoquant.in
#     ORACLE_SSH_USER  — e.g. ubuntu
#     ORACLE_SSH_KEY   — private half of a deploy-only SSH keypair (see the
#                        runbook for how to generate one scoped to just
#                        `git pull` + `docker compose` on this one host)
#
# Deliberately avoids third-party SSH actions — plain openssh in a bash step
# keeps the deploy path auditable without trusting an external Action.

on:
  push:
    branches: [main]
    paths:
      - "motoquant/**"
      - "motoquant.db"
      - "requirements-api.txt"
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - "docker-compose.yml"
      - "Caddyfile"
  workflow_dispatch:

concurrency:
  group: deploy-oracle
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets configured
        id: check
        run: |
          if [ -z "${{ secrets.ORACLE_SSH_HOST }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ORACLE_SSH_HOST not set — skipping deploy. See docs/ORACLE_MIGRATION.md Step 6."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via SSH
        if: steps.check.outputs.configured == 'true'
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_SSH_HOST: ${{ secrets.ORACLE_SSH_HOST }}
          ORACLE_SSH_USER: ${{ secrets.ORACLE_SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$ORACLE_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
              "$ORACLE_SSH_USER@$ORACLE_SSH_HOST" '
            set -e
            cd /opt/motoquant
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build
            docker image prune -f
          '
