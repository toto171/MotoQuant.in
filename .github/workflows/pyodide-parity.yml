name: Pyodide main-sim parity (manual)

# Least-privilege: read-only numeric verification; no write scope needed.
permissions:
  contents: read

# MANUAL-TRIGGER ONLY. This is the go/no-go proof for client-side FULL sims
# (the real RK4 engine in WebAssembly via Pyodide) — see
# docs/CLIENT_COMPUTE.md. It needs the Pyodide CDN for the numpy wasm wheel,
# which the Claude sandbox cannot reach; Actions runners can. Run it from the
# Actions tab before wiring any browser full-sim UI, and re-run it after any
# physics epoch (the pinned baselines are restated inside the harness on
# purpose, so a one-sided epoch bump fails loudly here).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test (defaults to the selected branch)"
        required: false
        default: ""

concurrency:
  group: pyodide-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: RK4-in-WASM vs pinned baselines
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Pyodide runtime
        working-directory: e2e
        run: npm init -y >/dev/null && npm install pyodide

      - name: Run parity harness (3 pinned baselines, real engine, WASM)
        working-directory: e2e
        run: node pyodide-mainsim-parity.mjs
