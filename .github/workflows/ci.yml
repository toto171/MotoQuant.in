name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests + lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-api.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt
          pip install -e .
          pip install ruff pytest

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Seed dev database
        run: |
          python -m motoquant.run --db /tmp/ci.db db init
          python -m motoquant.run --db /tmp/ci.db import --known-bikes
          python -m motoquant.run --db /tmp/ci.db db seed

      - name: Run pytest (fast suite)
        env:
          MOTOQUANT_DB: /tmp/ci.db
        run: pytest tests/ -q --maxfail=5

      - name: Physics benchmark sanity check
        run: |
          python - <<'PY'
          import motoquant
          tol = 0.15
          cases = {
              "K5":       (motoquant.gsxr1000_k5(),  10.034),
              "R1":       (motoquant.yzfr1_4c8(),    10.286),
              "Hayabusa": (motoquant.hayabusa_gen1(),10.472),
          }
          failed = []
          for name, (cfg, target) in cases.items():
              et = motoquant.MotoQuantEngine(cfg).run().time_quarter
              delta = et - target
              print(f"{name:10s} sim={et:.3f}s  target={target:.3f}s  delta={delta:+.3f}s")
              if abs(delta) > tol:
                  failed.append(name)
          if failed:
              raise SystemExit(f"Benchmark regression on: {failed}")
          PY

  desktop:
    name: Desktop (Tauri + React) typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Vite build
        run: npx vite build

  sidecar-smoke:
    name: Sidecar smoke test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Runs on every PR so the PyInstaller spec can't silently rot.
    # Uses ubuntu-latest for speed (Linux PyInstaller → Linux binary).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-api.txt
            desktop/sidecar/requirements-sidecar.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt
          pip install -e .
          pip install -r desktop/sidecar/requirements-sidecar.txt

      - name: Seed database
        run: |
          python -m motoquant.run db init
          python -m motoquant.run import --known-bikes
          python -m motoquant.run db seed

      - name: Build sidecar with PyInstaller
        working-directory: desktop/sidecar
        run: |
          pyinstaller motoquant-backend.spec --clean --noconfirm
          echo "Binary size: $(du -h dist/motoquant-backend | cut -f1)"
          [ -x dist/motoquant-backend ] || (echo "Binary missing or not executable" && exit 1)

      - name: Smoke test — spawn binary, curl /api/health
        working-directory: desktop/sidecar
        run: |
          PORT=$(python - <<'PY'
          import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()
          PY
          )
          ./dist/motoquant-backend --host 127.0.0.1 --port "$PORT" --log-level warning &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT

          echo "Sidecar PID=$PID on port $PORT — waiting for /api/health..."
          STATUS=0
          for i in $(seq 1 40); do
            sleep 0.5
            if curl -fsS "http://127.0.0.1:$PORT/api/health" > /tmp/health.json 2>/dev/null; then
              echo "✓ Health response: $(cat /tmp/health.json)"
              STATUS=0
              break
            fi
            STATUS=1
          done

          kill $PID 2>/dev/null || true
          wait $PID 2>/dev/null || true

          if [ $STATUS -ne 0 ]; then
            echo "❌ Sidecar did not respond to /api/health within 20 s"
            exit 1
          fi

          # Extra: verify bike_count > 0 (DB is seeded)
          python - <<'PY'
          import json, sys
          with open("/tmp/health.json") as f:
              data = json.load(f)
          assert data.get("status") == "ok",     f"status != ok: {data}"
          assert data.get("database") == "connected", f"db not connected: {data}"
          assert data.get("bike_count", 0) > 0,  f"bike_count=0: {data}"
          print(f"✓ bike_count={data['bike_count']}")
          PY

  web:
    name: Web (Next.js) build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Next.js build
        env:
          NEXT_PUBLIC_API_URL: https://api.motoquant.in
        run: npm run build
