name: CI

# Least-privilege: this workflow only reads the repo (tests, lint, coverage
# artifact upload). No write scope on the GITHUB_TOKEN.
permissions:
  contents: read

# 2026-07-17 minutes-budget rework (repo is private → Actions minutes are
# capped; the cap was crossed July 13 and every job insta-failed for days):
#   - Workflow is now PYTHON-ONLY and path-filtered. Web builds are covered by
#     web-verify.yml (which builds on web/** paths); the old in-file `web` job
#     had been committed TRUNCATED (no build steps) since June and gated
#     nothing. Desktop + sidecar-smoke jobs removed — the desktop app was
#     scrapped 2026-07-06 (ADR-0005); ~25-35 min/run for a dead product.
#   - PRs run the fast tier (~3 min: lint + fast tests + bit-identical
#     baseline gate). Pushes to main run the full suite + coverage (~46 min).
#     Net: per-PR cost drops from ~100 min to <10.
#   - deploy.yml gates production deploys on this workflow OR web-verify, so
#     web-only pushes (which skip CI entirely via the paths filter) still get
#     a gated deploy.
on:
  push:
    branches: [main]
    paths:
      - "motoquant/**"
      - "tests/**"
      - "scripts/**"
      - "motoquant.db"
      - "requirements-api.txt"
      - "pyproject.toml"
      - "Makefile"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "motoquant/**"
      - "tests/**"
      - "scripts/**"
      - "motoquant.db"
      - "requirements-api.txt"
      - "pyproject.toml"
      - "Makefile"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests + lint
    runs-on: ubuntu-latest
    # The full suite (main pushes only) runs the 541-bike no-silent-failure
    # sweep plus the SALib/sklearn sobol+surrogate tests. Base runtime is
    # ~20-25 min; the non-blocking --cov coverage instrumentation traces the
    # sim hot loop across every bike and adds a big multiplier. Cap raised
    # 50 -> 70 on 2026-07-13 (physics epoch); PR runs finish in ~5 min.
    timeout-minutes: 70
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-api.txt
            pyproject.toml

      - name: Secret scan (no token-shaped strings in tracked files)
        # stdlib-only + git; fails fast before we spend time installing deps.
        run: python scripts/health_check.py --secrets-only

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt
          pip install -e .
          # SALib/sklearn: optional analysis deps so sobol/surrogate tests run.
          # hypothesis: the 7 physics-invariant property tests
          # (tests/test_physics_invariants.py) importorskip on it — before
          # 2026-07-17 they had NEVER run in CI.
          pip install ruff pytest pytest-cov SALib scikit-learn hypothesis

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Physics baselines — bit-identical gate
        # Single source of truth for the pinned references (K5 / R1 /
        # Hayabusa). Replaces the old inline heredoc that still carried the
        # PRE-epoch pins with a ±0.15 band (R1's real margin had shrunk to
        # 7.6 ms — one more legitimate epoch away from a false red).
        run: python scripts/check_baselines.py

      - name: Seed dev database
        run: |
          python -m motoquant.run --db /tmp/ci.db db init
          python -m motoquant.run --db /tmp/ci.db import --known-bikes
          python -m motoquant.run --db /tmp/ci.db db seed

      - name: Run pytest (fast tier — pull requests)
        if: github.event_name == 'pull_request'
        env:
          MOTOQUANT_DB: /tmp/ci.db
        # Mirrors `make test-fast` + the always-on regression-snapshot guard.
        # The full suite still gates the merge itself via the push run on main.
        run: >
          pytest tests/test_validation.py tests/test_scraper.py
          tests/test_two_stroke.py tests/test_compatibility.py
          tests/test_submodel_kaizen.py tests/test_category_dispatch.py
          tests/test_physics_invariants.py tests/test_regression_snapshot.py
          -q --maxfail=5

      - name: Run pytest (full suite + coverage — main pushes)
        if: github.event_name == 'push'
        env:
          MOTOQUANT_DB: /tmp/ci.db
        # Coverage is a non-blocking SIGNAL (no --cov-fail-under gate) so a
        # branch-coverage dip never blocks a merge; the XML artifact answers
        # "which physics branches are actually exercised".
        run: pytest tests/ -q --maxfail=5 --cov=motoquant --cov-report=term-missing:skip-covered --cov-report=xml

      - name: Upload coverage report
        if: ${{ always() && github.event_name == 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
