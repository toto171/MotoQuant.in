name: Vercel Deploy

# Why this workflow exists:
#   On the Vercel Hobby (Free) plan, only the project-owner account can trigger
#   Git-integration deploys. Collaborators pushing to main don't auto-deploy.
#   This workflow works around that by calling `vercel deploy` via the CLI
#   using a stored token, so any merge to main (post-CI) produces a
#   production deploy regardless of who authored it.
#
#   Additionally it keeps the CI-gated deploy property: a red test suite
#   never reaches production, which Vercel's native Git integration does
#   not give you on any plan.
#
# When MotoQuant upgrades to Vercel Pro:
#   Pro lets all team members trigger deploys via Git integration, so the
#   "collaborators can't deploy" reason goes away. You can either:
#     (a) Keep this workflow — it still adds the CI-pass gate, which is
#         valuable (Vercel otherwise deploys any push, red tests or not).
#     (b) Delete this workflow and use Vercel's native integration with
#         an "Ignored Build Step" script that skips deploy if CI failed.
#   Recommendation: keep (a). The workflow is already written; the CI gate
#   is worth the ~30s it adds.
#
# Refinements from the starter template:
#   - Production deploys only fire after CI succeeds on main (workflow_run),
#     so a red test suite never reaches Vercel.
#   - Preview deploys run on every PR so collaborators get a shareable URL.
#   - All Vercel CLI commands run inside `web/` because that is the frontend
#     root (Next.js app). Don't change this unless you also change vercel.json.
#   - Concurrency group prevents two deploys from racing when PRs land
#     back-to-back.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN         — Account Settings → Tokens → "Full Access" scope
#   VERCEL_ORG_ID        — Account Settings → General → "Your ID"
#   VERCEL_PROJECT_ID    — Project → Settings → General → "Project ID"
#
# Rotate VERCEL_TOKEN quarterly. The token has full account access; anyone
# who can land a PR can effectively deploy to prod (gated by the review
# policy in CONTRIBUTING.md §6).
#
# SECURITY (open-source repo — read before editing):
#   * workflow_run runs in THIS repo's trusted context with secrets, but CI
#     and web-verify also run for pull requests FROM FORKS. The `branches:
#     [main]` filter matches head_branch only, so a fork's branch named
#     `main` passes it. deploy-production therefore also requires that the
#     upstream run was a `push` to THIS repository; only then is head_sha a
#     commit already on our main and safe to build with the token.
#   * Never check out an untrusted ref in a job that holds VERCEL_TOKEN.
#     Fork PRs get no secrets on `pull_request`, and deploy-preview is
#     additionally limited to same-repo branches (their authors already have
#     write access).
#   * The token reaches only the vercel steps (step-level env), never
#     checkout or the shell of unrelated steps; the CLI version is pinned so
#     a compromised `latest` cannot run with it. Bump VERCEL_CLI_VERSION
#     deliberately (dependabot does not track global npm installs).

# Least privilege: the jobs only read the repo. deploy-preview additionally
# comments the preview URL on its PR.
permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_CLI_VERSION: "63.1.2"
  # Presence flag only (never the token itself) so steps can skip, instead of
  # failing the check, until the VERCEL_* secrets are configured — Vercel's
  # own Git integration still produces the preview. They auto-activate the
  # moment the token is added.
  HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}

on:
  # zizmor: ignore[dangerous-triggers] -- guarded: deploy-production runs only
  # for a successful upstream PUSH to this repo's main (see SECURITY above).
  workflow_run:
    # CI is python-only and path-filtered since 2026-07-17, so web-only pushes
    # to main never trigger it; web-verify (which builds web/ on web/** paths)
    # is the gate for those. Caveat: a push touching BOTH python and web fires
    # both workflows and deploy-production runs on whichever succeeds first —
    # acceptable on the free tier where Vercel's native integration deploys
    # owner pushes ungated anyway.
    workflows: ["CI", "web-verify"]
    types: [completed]
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy-production:
    # Only when CI passed on a PUSH to main of THIS repository (see SECURITY
    # above — a fork PR from a branch named `main` must not reach here).
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # Trusted: the guard above proves this sha was pushed to our main.
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Install Vercel CLI
        if: ${{ env.HAS_VERCEL_TOKEN == 'true' }}
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      - name: Pull Vercel environment (production)
        if: ${{ env.HAS_VERCEL_TOKEN == 'true' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build project artifacts
        if: ${{ env.HAS_VERCEL_TOKEN == 'true' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel (production)
        if: ${{ env.HAS_VERCEL_TOKEN == 'true' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  deploy-preview:
    # Preview deploys on same-repo PRs so reviewers get a clickable URL. Fork
    # PRs are skipped outright: they get no secrets, and building their code
    # with the token must never be possible.
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: vercel-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Install Vercel CLI
        if: ${{ env.HAS_VERCEL_TOKEN == 'true' }}
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      - name: Pull Vercel environment (preview)
        if: ${{ env.HAS_VERCEL_TOKEN == 'true' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build project artifacts
        if: ${{ env.HAS_VERCEL_TOKEN == 'true' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy preview
        id: deploy
        if: ${{ env.HAS_VERCEL_TOKEN == 'true' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "preview_url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview deployed: $url"

      - name: Comment preview URL on PR
        if: steps.deploy.outputs.preview_url != ''
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7.1.0
        env:
          # Passed through the environment, not spliced into the script, so
          # the value can never be parsed as JavaScript.
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Vercel preview deployed: ${url}`
            });
