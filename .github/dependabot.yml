# Dependabot: one combined dependency-update pull request per ecosystem per
# month, to keep review (and notification) volume low. Security updates are
# configured in the repository settings and are not limited by this file.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Notes for reviewers:
#   * pip: the Docker image installs requirements-api.lock, not
#     requirements-api.txt. After merging a pip bump, run `make lock` and
#     commit the regenerated lock (or Dependabot's own lock change, if any).
#   * Any bump that can touch numerics (numpy, the Rust core's deps) must pass
#     `make baselines` and the golden snapshot before merge (docs/INVARIANTS.md).
#   * The Vercel CLI used by .github/workflows/deploy.yml is a pinned global
#     npm install (VERCEL_CLI_VERSION); Dependabot does not track it.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      web:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: "/rust"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      rust:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
