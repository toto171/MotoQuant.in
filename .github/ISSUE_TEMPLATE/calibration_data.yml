name: Dyno sheet or ECU log
description: A dyno pull or an ECU data log that can check or improve a bike's engine model. For a quarter-mile run, use "Submit a timeslip" instead.
title: "Calibration data: "
labels: ["calibration", "data"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for capturing data. A real power curve is the best way to replace the estimated curve a bike's model starts from. Attach the file by dragging it into the "Files" box below; GitHub accepts CSV, TXT and ZIP. Only share data you recorded or have the right to share.

  - type: dropdown
    id: kind
    attributes:
      label: Data type
      options:
        - Dyno sheet (DynoJet CSV, generic metric CSV, MoTeC export)
        - ECU log (Woolich, Power Commander PC-Link, MoTeC i2)
        - Both
    validations:
      required: true

  - type: input
    id: bike
    attributes:
      label: Bike (make, model, year)
    validations:
      required: true

  - type: dropdown
    id: stock
    attributes:
      label: Was the bike stock?
      options:
        - Stock
        - Modified (list the changes below)
    validations:
      required: true

  - type: textarea
    id: mods
    attributes:
      label: Changes from stock

  - type: textarea
    id: conditions
    attributes:
      label: Conditions
      description: For a dyno, the correction standard used (SAE J1349, DIN, uncorrected) and the room temperature and pressure. For a log, the weather and the venue.

  - type: textarea
    id: files
    attributes:
      label: Files
      description: Drag the file into this box.
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes
