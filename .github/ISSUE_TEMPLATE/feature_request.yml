name: Feature request
description: Propose a new feature, sub-model, or capability.
title: "[feat] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: check docs/ROADMAP.md and search existing issues. If your idea is already planned, comment on the existing issue instead of opening a new one.

  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What problem would this solve? Who benefits?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Concrete design sketch. Function signatures, new CLI flags, new DB columns, UI mockup, whatever gets the idea across.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What else did you think about? Why did you pick the proposal above?

  - type: dropdown
    id: phase
    attributes:
      label: Which area does this belong to?
      options:
        - Physics / sub-models
        - Catalog data / ingestion
        - Validation / calibration
        - AI / optimisation / chat
        - Web app / UX
        - Self-hosting / deployment
        - Docs / contributor experience
        - Out of scope — please discuss first
    validations:
      required: true

  - type: dropdown
    id: effort
    attributes:
      label: Rough effort estimate
      options:
        - Small (under 1 day)
        - Medium (1–3 days)
        - Large (a week+)
        - Unknown — needs scoping
    validations:
      required: true
