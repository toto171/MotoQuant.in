name: Feature request
description: Propose a new feature, sub-model, or capability.
title: "[feat] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: check CLAUDE.md → "Full Project Roadmap". If your idea is already in a future phase, comment there instead of opening a new issue.

  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What problem would this solve? Who benefits?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Concrete design sketch. Function signatures, new CLI flags, new DB columns, UI mockup, whatever gets the idea across.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What else did you think about? Why did you pick the proposal above?

  - type: dropdown
    id: phase
    attributes:
      label: Which phase does this belong to?
      options:
        - Phase 1 — Core physics (additions)
        - Phase 2 — Database / ingestion
        - Phase 3 — Validation / calibration
        - Phase 4 — AI / optimisation
        - Phase 5 — Desktop app
        - Phase 6 — Commercial launch
        - Out of scope — please discuss first
    validations:
      required: true

  - type: dropdown
    id: effort
    attributes:
      label: Rough effort estimate
      options:
        - Small (under 1 day)
        - Medium (1–3 days)
        - Large (a week+)
        - Unknown — needs scoping
    validations:
      required: true
